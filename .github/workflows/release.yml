name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches pluginVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^pluginVersion *= *//p' gradle.properties)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pluginVersion=$version" >&2
            exit 1
          fi

      - name: Test, build and verify
        run: ./gradlew test buildPlugin verifyPlugin

      - name: Publish to JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/') && env.PUBLISH_TOKEN != '' && vars.SKIP_PUBLISH != 'true'
        run: ./gradlew publishPlugin

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
